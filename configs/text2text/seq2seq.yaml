task: "text2text"

# data_args
train_file_path: "/data/private/customer_aigc/GJ/text2text/data/translation/train.jsonl"
valid_file_path: "/data/private/customer_aigc/GJ/text2text/data/translation/valid.jsonl"
test_file_path: null
num_processing: 16
instruction_key: "instruction"
source_key: "input"
target_key: "output"
default_instruction: ""
system_prompt: ""
prompt_template: "{instruction}\n{input}"
source_prefix: "translate Chinese to English: "
max_source_length: 512
max_target_length: 512


# model_args
model_name_or_path: "/data/team/llm/mt5-base"
model_type: "seq2seq_lm"
trust_remote_code: false


# train_args
output_dir: "../../output_text2text_seq2seq/"
overwrite_output_dir: true
do_train: true
do_eval: true
eval_strategy: "steps"
eval_steps: 100
per_device_train_batch_size: 16
per_device_eval_batch_size: 16
gradient_accumulation_steps: 2
num_train_epochs: 3
lr_scheduler_type: "linear"
warmup_ratio: 0.05
save_strategy: "steps"
save_steps: 100
save_total_limit: 2
optim: "adamw_torch"
report_to: "none"
remove_unused_columns: false
bf16: true
log_level: "info"
logging_steps: 20
logging_dir: "./log/"
learning_rate: 0.0003
save_only_model: true
attn_implementation: "eager"
predict_with_generate: true
generation_max_length: 512
generation_num_beams: 4

do_generation_eval: true
gen_eval_max_samples: 1000
gen_eval_batch_size: 32
gen_max_new_tokens: 512
gen_num_beams: 4
measures: ["bleu", "rougeL"]
metric_tokenize: "whitespace"
