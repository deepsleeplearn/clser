[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clser"
version = "0.1.0"
description = "小模型微调工具：文本分类、文本生成、重排序"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{name = "guojian"}]
dependencies = [
    "transformers>=4.55",
    "torch",
    "datasets",
    "evaluate",
    "scikit-learn",
    "numpy",
    "pyyaml",
    "typeguard",
]

[project.optional-dependencies]
hp = ["optuna"]

[project.scripts]
clser = "clser.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["clser*"]

[tool.ruff]
line-length = 100
target-version = "py310"

select = ["E", "F", "I", "UP", "B"]
ignore = []



